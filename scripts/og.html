<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card</title>
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2')
          format('woff2-variations');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-standard-italic.woff2')
          format('woff2-variations');
        font-style: italic;
      }
      @font-face {
        font-family: 'Martian';
        src: url('../node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-standard-normal.woff2')
          format('woff2-variations');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f3f0e8;
        color: #16150f;
      }
      .card {
        position: relative;
        display: grid;
        grid-template-columns: 560px 1fr;
        gap: 36px;
        height: 100%;
        padding: 56px 0 56px 64px;
        box-sizing: border-box;
      }
      .kicker {
        font:
          450 15px/1 'Martian',
          monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6a655a;
      }
      h1 {
        margin: 26px 0 0;
        font:
          640 70px/0.98 'Bricolage',
          sans-serif;
        font-variation-settings: 'opsz' 96;
        letter-spacing: -0.035em;
      }
      h1 em {
        font:
          italic 380 70px/1 'Newsreader',
          serif;
        letter-spacing: 0;
      }
      .foot {
        position: absolute;
        left: 64px;
        bottom: 52px;
        font:
          450 15px/1 'Martian',
          monospace;
        letter-spacing: 0.04em;
        color: #3a3730;
      }
      .spines {
        min-width: 0;
        width: 100%;
        overflow: hidden;
        display: flex;
        gap: 8px;
        height: 518px;
        transform: translateX(8px);
      }
      .spines img {
        flex: 1 1 0;
        width: 0;
        min-width: 0;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        border-radius: 12px;
        box-shadow: inset 0 0 0 1px #16150f1a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <p class="kicker">Mustafa Obaid — software engineer</p>
        <h1>Interactive models of mathematics, physics <em>&amp;</em> computation.</h1>
        <p class="foot">mustafaobaidd1.github.io · 10 projects</p>
      </div>
      <div class="spines" id="spines"></div>
    </div>
    <script>
      const slugs = [
        'karman-wind-tunnel',
        'scatter-sky-lab',
        'heliograph-solar',
        'strut-topology',
        'quiet-zone-qr',
        'horocycle-hyperbolic',
        'deep-focus-earthquakes',
        'lensing-game',
      ];
      const box = document.getElementById('spines');
      for (const s of slugs) {
        const img = document.createElement('img');
        img.src = `../src/assets/previews/${s}-mobile.png`;
        img.onerror = () => (img.src = `../src/assets/previews/${s}.png`);
        box.append(img);
      }
    </script>
  </body>
</html>
